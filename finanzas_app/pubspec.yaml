name: finanzas_app
description: "Mis Finanzas - aplicación de finanzas personales (Flutter + Supabase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend y persistencia
  supabase_flutter: ^2.8.3
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1

  # Seguridad y utilidades
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: any

  # UI y funciones de dispositivo
  fl_chart: ^0.70.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.1

  # Exportación / importación
  csv: ^6.0.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
